<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XV da Laís</title>

  <!-- Tipografia de Gala: Cinzel, Pinyon Script e Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Pinyon+Script&family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="viewport">
    
    <!-- Camada 1: Capa Inicial (Envelope Fechado com Selo Prata Interativo) -->
    <section id="cover-layer" class="fullscreen-layer">
      <!-- Instrução sutil e delicada no topo -->
      <div class="cover-top-instruction">
        <span class="instruction-line"></span>
        <span class="instruction-text">TOQUE NO LACRE PARA ABRIR</span>
        <span class="instruction-line"></span>
      </div>

      <!-- Hotspot pulsante diretamente sobre o selo de cera na imagem -->
      <button id="seal-trigger" class="seal-hotspot" aria-label="Romper lacre e abrir convite">
        <span class="seal-glow-ring"></span>
        <span class="seal-glow-ring ring-delay"></span>
      </button>

      <div class="cover-content">
        <p class="cursive-callout">Você é nosso convidado especial</p>
        <h2 class="cover-title">XV da Laís</h2>
      </div>
    </section>

    <!-- Camada 2: Player de Vídeo (video.mp4 abrindo o portão) -->
    <video 
      id="portal-video" 
      class="fullscreen-layer" 
      playsinline 
      webkit-playsinline 
      preload="auto">
      <source src="assets/video.mp4" type="video/mp4" />
    </video>

    <!-- Camada 3: Fundo Final Intacto (fundo.png escolhido por você) -->
    <div id="final-backdrop" class="fullscreen-layer"></div>

    <!-- Camada 4: Elementos de Interface gerados 100% via Código (HTML/CSS) sobrepostos à foto -->
    <section id="interactive-layer" class="fullscreen-layer">
      
      <!-- Moldura Ornamental com Cantoneiras em Vetor SVG -->
      <div class="frame-container">
        <svg class="frame-corner corner-tl" viewBox="0 0 100 100" fill="none">
          <path d="M10 90 V20 Q10 10 20 10 H90" stroke="url(#silverGrad)" stroke-width="2"/>
          <path d="M18 90 V26 Q18 18 26 18 H90" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="3,3"/>
          <circle cx="20" cy="20" r="3" fill="url(#silverGrad)"/>
          <path d="M26 10 C32 16 38 18 50 14" stroke="url(#silverGrad)" stroke-width="1"/>
          <path d="M10 26 C16 32 18 38 14 50" stroke="url(#silverGrad)" stroke-width="1"/>
        </svg>

        <svg class="frame-corner corner-tr" viewBox="0 0 100 100" fill="none">
          <path d="M90 90 V20 Q90 10 80 10 H10" stroke="url(#silverGrad)" stroke-width="2"/>
          <path d="M82 90 V26 Q82 18 74 18 H10" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="3,3"/>
          <circle cx="80" cy="20" r="3" fill="url(#silverGrad)"/>
          <path d="M74 10 C68 16 62 18 50 14" stroke="url(#silverGrad)" stroke-width="1"/>
          <path d="M90 26 C84 32 82 38 86 50" stroke="url(#silverGrad)" stroke-width="1"/>
        </svg>

        <svg class="frame-corner corner-bl" viewBox="0 0 100 100" fill="none">
          <path d="M10 10 V80 Q10 90 20 90 H90" stroke="url(#silverGrad)" stroke-width="2"/>
          <path d="M18 10 V74 Q18 82 26 82 H90" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="3,3"/>
          <circle cx="20" cy="80" r="3" fill="url(#silverGrad)"/>
          <path d="M26 90 C32 84 38 82 50 86" stroke="url(#silverGrad)" stroke-width="1"/>
          <path d="M10 74 C16 68 18 62 14 50" stroke="url(#silverGrad)" stroke-width="1"/>
        </svg>

        <svg class="frame-corner corner-br" viewBox="0 0 100 100" fill="none">
          <path d="M90 10 V80 Q90 90 80 90 H10" stroke="url(#silverGrad)" stroke-width="2"/>
          <path d="M82 10 V74 Q82 82 74 82 H10" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="3,3"/>
          <circle cx="80" cy="80" r="3" fill="url(#silverGrad)"/>
          <path d="M74 90 C68 84 62 82 50 86" stroke="url(#silverGrad)" stroke-width="1"/>
          <path d="M90 74 C84 68 82 62 86 50" stroke="url(#silverGrad)" stroke-width="1"/>
        </svg>
      </div>

      <!-- Conteúdo do Convite -->
      <div class="content-box">
        
        <!-- Lua Crescente Vetorial em SVG com Brilho Dinâmico -->
        <div class="moon-wrapper">
          <svg viewBox="0 0 100 100" class="moon-svg">
            <defs>
              <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="35%" stop-color="#e2e8f0" />
                <stop offset="70%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#94a3b8" />
              </linearGradient>
              <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <path d="M52 14 A36 36 0 1 0 86 54 A28 28 0 1 1 52 14 Z" fill="url(#silverGrad)" filter="url(#silverGlow)" />
            <polygon points="56,22 57.5,26.5 62,28 57.5,29.5 56,34 54.5,29.5 50,28 54.5,26.5" fill="#ffffff" filter="url(#silverGlow)" />
            <polygon points="76,40 77,43 80,44 77,45 76,48 75,45 72,44 75,43" fill="#ffffff" />
          </svg>
        </div>

        <!-- Cabeçalho -->
        <header class="invite-header">
          <p class="poetic-sub">CONVIDO VOCÊ PARA CELEBRAR</p>
          <p class="poetic-sub">MEUS 15 ANOS</p>
        </header>

        <!-- Monograma XV 100% em Código: Tipografia Cinzel + Arabescos SVG -->
        <div class="monogram-container">
          <svg class="swash-svg swash-left" viewBox="0 0 120 40">
            <path d="M10 22 C35 8, 65 32, 95 18 C105 13, 115 16, 120 20" fill="none" stroke="url(#silverGrad)" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="10" cy="22" r="2" fill="url(#silverGrad)"/>
            <path d="M40 19 C55 12, 75 24, 90 19" fill="none" stroke="url(#silverGrad)" stroke-width="1" opacity="0.6"/>
          </svg>

          <span class="silver-text-metal monogram-letters">XV</span>

          <svg class="swash-svg swash-right" viewBox="0 0 120 40">
            <path d="M110 22 C85 8, 55 32, 25 18 C15 13, 5 16, 0 20" fill="none" stroke="url(#silverGrad)" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="110" cy="22" r="2" fill="url(#silverGrad)"/>
            <path d="M80 19 C65 12, 45 24, 30 19" fill="none" stroke="url(#silverGrad)" stroke-width="1" opacity="0.6"/>
          </svg>
        </div>

        <!-- Nome em Caligrafia de Gala -->
        <h1 class="silver-text-metal celebrant-name">Laís Eduarda</h1>

        <!-- Divisor Ornamental Prata -->
        <div class="silver-separator">
          <span class="sep-line"></span>
          <span class="sep-star">✦</span>
          <span class="sep-line"></span>
        </div>

        <!-- Bloco de Data e Horário em Código Puro -->
        <div class="calendar-block">
          <div class="cal-col cal-day-name">SÁBADO</div>
          <div class="cal-divider-vertical"></div>
          <div class="cal-col-center">
            <span class="silver-text-metal cal-big-day">17</span>
            <span class="cal-month-year">OUTUBRO • 2026</span>
          </div>
          <div class="cal-divider-vertical"></div>
          <div class="cal-col cal-time">ÀS 21:00H</div>
        </div>

        <!-- Divisor Ornamental Prata -->
        <div class="silver-separator">
          <span class="sep-line"></span>
          <span class="sep-star">✦</span>
          <span class="sep-line"></span>
        </div>

        <!-- Bloco de Localização -->
        <div class="venue-block">
          <div class="venue-icon-wrapper">
            <svg class="venue-svg" viewBox="0 0 24 24" fill="none" stroke="url(#silverGrad)" stroke-width="1.5">
              <path d="M12 21s-6-5.333-6-10a6 6 0 1 1 12 0c0 4.667-6 10-6 10z"/>
              <circle cx="12" cy="11" r="2.5"/>
            </svg>
          </div>
          <h2 class="venue-name">ESPACE CELEBRATION</h2>
          <p class="venue-address">Rua das Flores, 1500 — Jardim Real</p>
          <p class="venue-city">Belo Horizonte — MG</p>
        </div>

        <!-- Botão Interativo "Como Chegar" -->
        <footer class="actions-block">
          <a href="https://maps.google.com" target="_blank" class="btn-royal-action">
            <span class="btn-royal-shimmer"></span>
            <span class="btn-caption">COMO CHEGAR</span>
          </a>
        </footer>

      </div>
    </section>
  </main>

  <audio id="bg-music" src="assets/musica.mp3" loop preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
